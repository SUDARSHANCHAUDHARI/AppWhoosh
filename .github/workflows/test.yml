name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Create test .env
        run: |
          cp .env.example .env
          echo "ANTHROPIC_API_KEY=test-key" >> .env
          echo "KEYSTORE_BASE_PATH=/tmp" >> .env
          echo "BUILD_OUTPUT_DIR=/tmp/appwhoosh-builds" >> .env

      - name: Run tests
        run: npm test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
